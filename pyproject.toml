[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clara-app"
version = "0.1.0"
description = "Clara's desktop chat: a window opened from the Windows notification area"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "pypdf>=4.0",  # the text of attached PDF documents
    "markdown-it-py>=3.0",  # Clara's answers with formulas: Markdown to HTML, for the web view that typesets them
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
clara-app = "clara_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clara_app = ["katex/*", "katex/fonts/*", "fonts/*", "clara.ico", "clara.png"]  # KaTeX (formulas, the same files as the web site), the two fonts of the site, and Clara's picture

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
